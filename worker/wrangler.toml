name = "droga-do-miliona-records"
main = "src/index.js"
compatibility_date = "2026-08-06"

# Create the D1 database before deploy and replace the placeholder database_id.
[[d1_databases]]
binding = "DB"
database_name = "droga-records"
database_id = "replace-with-cloudflare-d1-database-id"
migrations_dir = "migrations"

# Protects unlimited legitimate storage from automated write exhaustion.
# Replace namespace_id if 1001 is already used by another binding in the account.
[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Kept read-only for the idempotent, authenticated legacy import and rollback.
[[r2_buckets]]
binding = "LEGACY_RECORDS"
bucket_name = "droga-records"
