<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMSO — prototyp historii klienta v6</title>
    <style>
      :root {
        color-scheme: only light;
        font-family: Lato, Arial, sans-serif;
        color: #171717;
        background: #f4f0e8;
        --orange: #f47100;
        --coral: #f04f45;
        --magenta: #eb32a4;
        --paper: #faf7f0;
        --ink: #171717;
        --muted: #6f6a62;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 390px; }
      button { font: inherit; }

      .prototype {
        width: min(100%, 1600px);
        min-height: 100svh;
        margin-inline: auto;
        padding: clamp(14px, 2vw, 28px);
        display: grid;
        place-items: center;
      }

      .prototype__frame {
        width: 100%;
        min-height: min(900px, calc(100svh - 28px));
        display: grid;
        grid-template-columns: minmax(0, 62fr) minmax(360px, 38fr);
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 30px;
        background: var(--paper);
        box-shadow: 14px 16px 0 rgb(23 23 23 / 14%);
      }

      .prototype__visual {
        position: relative;
        min-height: 620px;
        overflow: hidden;
        border-right: 3px solid var(--ink);
        background:
          radial-gradient(circle at 2px 2px, rgb(23 23 23 / 7%) 1.2px, transparent 1.3px) 0 0 / 16px 16px,
          #f8f4ec;
      }

      .prototype__visual svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .prototype__copy {
        padding: clamp(28px, 4vw, 70px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #fff;
      }

      .prototype__eyebrow {
        margin: 0 0 22px;
        color: #a72752;
        font-weight: 900;
        font-size: clamp(0.82rem, 1.2vw, 1rem);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .prototype h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.5rem, 5.2vw, 5.9rem);
        line-height: 0.91;
        letter-spacing: -0.075em;
      }

      .prototype__body {
        max-width: 37rem;
        margin: 30px 0 0;
        color: #44413c;
        font-size: clamp(1.08rem, 1.6vw, 1.55rem);
        line-height: 1.5;
      }

      .prototype__progress {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 34px;
      }

      .prototype__dot {
        width: 13px;
        height: 13px;
        padding: 0;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #fff;
      }

      .prototype__dot[aria-current="step"] {
        width: 34px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--orange), var(--coral), var(--magenta));
      }

      .prototype__step-label {
        margin-left: 7px;
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .prototype__cta {
        width: 100%;
        min-height: 66px;
        margin-top: 24px;
        border: 4px solid var(--ink);
        border-radius: 18px;
        color: var(--ink);
        background: linear-gradient(100deg, var(--orange), var(--coral), var(--magenta));
        box-shadow: 6px 7px 0 var(--ink);
        font-size: 1.08rem;
        font-weight: 950;
        cursor: pointer;
        transition: filter 150ms ease, opacity 150ms ease, transform 150ms ease;
      }

      .prototype__cta:hover:not(:disabled) { filter: saturate(1.12) brightness(1.04); }
      .prototype__cta:active:not(:disabled) { transform: translate(4px, 5px); box-shadow: 2px 2px 0 var(--ink); }
      .prototype__cta:focus-visible { outline: 5px solid #fff; outline-offset: -9px; }
      .prototype__cta:disabled { cursor: wait; filter: grayscale(0.65); opacity: 0.52; box-shadow: none; }

      .prototype__fact {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 9%;
        min-width: min(66%, 440px);
        padding: 14px 20px;
        transform: translateX(-50%);
        border: 4px solid var(--ink);
        border-radius: 16px;
        background: #fff;
        box-shadow: 8px 9px 0 rgb(23 23 23 / 16%);
        text-align: center;
        font-size: clamp(1rem, 2vw, 1.6rem);
        font-weight: 950;
        letter-spacing: 0.04em;
      }

      .prototype__fact::after {
        content: "";
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 7px;
        height: 5px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--orange), var(--coral), var(--magenta));
      }

      [data-state-layer] {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center bottom;
        pointer-events: none;
      }

      [data-visible="true"] { opacity: 1; }

      .is-entering [data-visible="true"][data-motion="arrive"] {
        animation: arrive 780ms cubic-bezier(.2,.75,.2,1) both;
      }

      .is-entering [data-visible="true"][data-motion="rise"] {
        animation: rise 920ms cubic-bezier(.2,.78,.15,1) 180ms both;
      }

      .is-entering [data-visible="true"][data-motion="team"] {
        animation: team 980ms cubic-bezier(.18,.75,.14,1) 300ms both;
      }

      .is-entering .prototype__fact { animation: fact 560ms ease-out 620ms both; }

      @keyframes arrive {
        from { opacity: 0; transform: translateX(90px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(65px) scale(0.92); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes team {
        from { opacity: 0; transform: translateX(75px) scale(0.94); }
        to { opacity: 1; transform: translateX(0) scale(1); }
      }

      @keyframes fact {
        from { opacity: 0; transform: translate(-50%, -16px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }

      @media (max-width: 756px) {
        .prototype { padding: 0; display: block; }
        .prototype__frame {
          min-height: 100svh;
          grid-template-columns: 1fr;
          grid-template-rows: minmax(360px, 52svh) minmax(0, 1fr);
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .prototype__visual {
          min-height: 0;
          border-right: 0;
          border-bottom: 3px solid var(--ink);
        }
        .prototype__copy {
          padding: 25px max(20px, env(safe-area-inset-left));
          justify-content: flex-start;
        }
        .prototype__eyebrow { margin-bottom: 12px; }
        .prototype h1 { max-width: 14ch; font-size: clamp(2.3rem, 11vw, 3.5rem); }
        .prototype__body { margin-top: 15px; font-size: 1rem; }
        .prototype__progress { margin-top: 18px; }
        .prototype__cta { min-height: 58px; margin-top: 17px; }
        .prototype__fact { top: 5%; min-width: 78%; padding: 10px 14px; font-size: 0.95rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype" data-prototype>
      <section class="prototype__frame" aria-labelledby="prototype-title">
        <div class="prototype__visual is-entering" data-visual>
          <div class="prototype__fact" data-fact>BUDŻET DO 400 ZŁ</div>
          <svg viewBox="0 0 960 675" role="img" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">Rozwój firmy klienta</title>
            <desc id="scene-desc" data-scene-description>Klient rozpoczyna działalność przy małym biurku.</desc>
            <defs>
              <linearGradient id="brand" x1="0" x2="1">
                <stop stop-color="#f47100" />
                <stop offset=".52" stop-color="#f04f45" />
                <stop offset="1" stop-color="#eb32a4" />
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
                <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#171717" flood-opacity=".15" />
              </filter>
            </defs>

            <g data-environment>
              <path d="M0 515H960V675H0z" fill="#e9e2d6" />
              <path d="M0 515H960" stroke="#171717" stroke-width="8" />
              <path d="M38 125h198v170H38z" fill="#dceef2" stroke="#171717" stroke-width="8" />
              <path d="M137 125v170M38 210h198" stroke="#fff" stroke-width="8" />
              <path d="M720 117h174v278H720z" fill="#fff" stroke="#171717" stroke-width="8" />
              <path d="M742 169h130M742 238h130M742 307h130" stroke="#171717" stroke-width="7" />
              <g fill="#c9925e" stroke="#171717" stroke-width="4">
                <path d="M749 132h47v31h-47zm57 0h58v31h-58z" />
                <path d="M749 192h67v40h-67zm77 202h38v-82h-38" />
              </g>
            </g>

            <g data-state-layer="small-desk" data-visible="true">
              <path d="M170 432h405v28H170z" fill="#171717" />
              <path d="M196 460v128M548 460v128" stroke="#171717" stroke-width="18" />
              <path d="M222 389h86v43h-86z" fill="#fff" stroke="#171717" stroke-width="7" />
              <path d="M234 402h60" stroke="url(#brand)" stroke-width="8" />
              <path d="M620 475h91v113h-91z" fill="#c9925e" stroke="#171717" stroke-width="8" filter="url(#shadow)" />
              <path d="M666 475v113M620 500h91" stroke="#171717" stroke-width="5" />
              <rect x="635" y="523" width="61" height="34" rx="4" fill="#fff" stroke="#171717" stroke-width="4" />
              <path d="M645 547h41" stroke="#f04f45" stroke-width="7" />
            </g>

            <g data-state-layer="client" data-visible="true">
              <circle cx="390" cy="334" r="43" fill="#f0b784" stroke="#171717" stroke-width="8" />
              <path d="M348 331c0-33 18-54 43-54 27 0 45 21 45 54-18-4-29-14-38-30-11 18-26 28-50 30z" fill="#4b3428" />
              <path d="M327 452v-48c0-46 28-73 64-73s64 27 64 73v48" fill="#f04f45" stroke="#171717" stroke-width="8" />
              <path d="M346 452v120m90-120v120" stroke="#171717" stroke-width="18" />
              <path d="M330 580h49m29 0h49" stroke="#fff" stroke-width="17" />
            </g>

            <g data-state-layer="wallet" data-visible="true" data-motion="arrive">
              <rect x="470" y="358" width="88" height="64" rx="9" fill="#fff" stroke="#171717" stroke-width="7" />
              <path d="M485 381h60" stroke="url(#brand)" stroke-width="9" />
              <circle cx="536" cy="405" r="6" fill="#171717" />
            </g>

            <g data-state-layer="laptop" data-visible="false" data-motion="arrive" filter="url(#shadow)">
              <path d="M208 285h237l-20 147H188z" fill="#242424" stroke="#171717" stroke-width="8" />
              <path d="M221 303h205l-15 107H205z" fill="#fff" />
              <path d="M252 328h128v55H252z" fill="url(#brand)" />
              <path d="M164 432h300l-27 29H188z" fill="#444" stroke="#171717" stroke-width="7" />
            </g>

            <g data-state-layer="calendar" data-visible="false" data-motion="rise" filter="url(#shadow)">
              <path d="M503 175h155v143H503z" fill="#fff" stroke="#171717" stroke-width="8" />
              <path d="M503 175h155v36H503z" fill="url(#brand)" />
              <path d="M535 241h91M535 269h91" stroke="#171717" stroke-width="8" />
              <path d="M548 157v36m65-36v36" stroke="#171717" stroke-width="9" stroke-linecap="round" />
            </g>

            <g data-state-layer="grown-office" data-visible="false" data-motion="team">
              <path d="M501 408h405v25H501z" fill="#171717" />
              <path d="M524 433v137m356-137v137" stroke="#171717" stroke-width="17" />
              <g fill="#fff" stroke="#171717" stroke-width="7" filter="url(#shadow)">
                <path d="M535 274h139v105H535zM711 274h139v105H711z" />
              </g>
              <path d="M555 297h99v58h-99zm176 0h99v58h-99" fill="url(#brand)" opacity=".82" />
              <path d="M604 379v29m176-29v29" stroke="#171717" stroke-width="11" />
              <g>
                <circle cx="586" cy="460" r="34" fill="#f0b784" stroke="#171717" stroke-width="7" />
                <path d="M544 574v-70c0-35 19-57 42-57s42 22 42 57v70" fill="#eb32a4" stroke="#171717" stroke-width="8" />
                <circle cx="780" cy="460" r="34" fill="#bd8258" stroke="#171717" stroke-width="7" />
                <path d="M738 574v-70c0-35 19-57 42-57s42 22 42 57v70" fill="#f47100" stroke="#171717" stroke-width="8" />
              </g>
              <g fill="#c9925e" stroke="#171717" stroke-width="5">
                <path d="M848 493h75v76h-75zm-156 37h52v39h-52" />
              </g>
              <path d="M886 493v76M848 516h75" stroke="#171717" stroke-width="4" />
            </g>

            <g data-state-layer="original-laptop-marker" data-visible="false" data-motion="rise">
              <path d="M305 255c36-43 86-51 134-27" fill="none" stroke="url(#brand)" stroke-width="11" stroke-linecap="round" />
              <path d="M423 207l25 23-34 10" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            </g>
          </svg>
        </div>

        <div class="prototype__copy">
          <p class="prototype__eyebrow">Historia klienta · prototyp v6</p>
          <h1 id="prototype-title" data-title>Na początku liczył się każdy wydatek.</h1>
          <p class="prototype__body" data-body>Klient dopiero rozpoczynał działalność. Szukał narzędzia do pracy w budżecie do 400 zł.</p>
          <div class="prototype__progress" aria-label="Postęp historii">
            <button class="prototype__dot" type="button" aria-label="Krok 1" aria-current="step" disabled></button>
            <button class="prototype__dot" type="button" aria-label="Krok 2" disabled></button>
            <button class="prototype__dot" type="button" aria-label="Krok 3" disabled></button>
            <button class="prototype__dot" type="button" aria-label="Krok 4" disabled></button>
            <span class="prototype__step-label" data-step-label>Krok 1 z 4</span>
          </div>
          <button class="prototype__cta" type="button" data-continue disabled>Dalej</button>
        </div>
      </section>
    </main>

    <script>
      const steps = [
        {
          title: "Na początku liczył się każdy wydatek.",
          body: "Klient dopiero rozpoczynał działalność. Szukał narzędzia do pracy w budżecie do 400 zł.",
          fact: "BUDŻET DO 400 ZŁ",
          description: "Klient rozpoczyna działalność przy małym biurku i sprawdza dostępny budżet.",
          layers: ["small-desk", "client", "wallet"]
        },
        {
          title: "Wybrał laptop za 300 zł.",
          body: "Sprawdzony sprzęt pozwolił rozpocząć pracę bez obciążania młodej firmy.",
          fact: "PIERWSZY LAPTOP · 300 ZŁ",
          description: "Ten sam klient rozpoczyna pracę na wybranym laptopie za 300 zł.",
          layers: ["small-desk", "client", "laptop"]
        },
        {
          title: "Minął rok.",
          body: "Firma rosła. Pojawiły się nowe zadania, pracownicy i potrzeba kolejnych stanowisk.",
          fact: "1 ROK PÓŹNIEJ",
          description: "Kalendarz pokazuje upływ roku, a obok pierwszego laptopa powstają nowe stanowiska.",
          layers: ["small-desk", "client", "laptop", "calendar", "grown-office"]
        },
        {
          title: "Wrócił z budżetem 100 000 zł.",
          body: "Pierwszy laptop przypominał, że sprzęt poleasingowy nadal był rozsądnym wyborem — także w większej skali.",
          fact: "BUDŻET 100 000 ZŁ",
          description: "Rozwinięta firma wraca po sprzęt dla zespołu, a pierwszy laptop pozostaje częścią historii.",
          layers: ["small-desk", "client", "laptop", "grown-office", "original-laptop-marker"]
        }
      ];

      const visual = document.querySelector("[data-visual]");
      const title = document.querySelector("[data-title]");
      const body = document.querySelector("[data-body]");
      const fact = document.querySelector("[data-fact]");
      const description = document.querySelector("[data-scene-description]");
      const stepLabel = document.querySelector("[data-step-label]");
      const continueButton = document.querySelector("[data-continue]");
      const dots = [...document.querySelectorAll(".prototype__dot")];
      const layers = [...document.querySelectorAll("[data-state-layer]")];
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let currentStep = 0;
      let unlockTimer = 0;

      function renderStep(index) {
        const step = steps[index];
        clearTimeout(unlockTimer);
        continueButton.disabled = true;
        visual.classList.remove("is-entering");
        void visual.offsetWidth;
        title.textContent = step.title;
        body.textContent = step.body;
        fact.textContent = step.fact;
        description.textContent = step.description;
        stepLabel.textContent = `Krok ${index + 1} z ${steps.length}`;
        continueButton.textContent = index === steps.length - 1 ? "Zobacz od początku" : "Dalej";
        for (const layer of layers) {
          layer.dataset.visible = String(step.layers.includes(layer.dataset.stateLayer));
        }
        for (const [dotIndex, dot] of dots.entries()) {
          if (dotIndex === index) dot.setAttribute("aria-current", "step");
          else dot.removeAttribute("aria-current");
        }
        visual.classList.add("is-entering");
        unlockTimer = setTimeout(() => {
          continueButton.disabled = false;
          continueButton.focus({ preventScroll: true });
        }, reducedMotion.matches ? 500 : 1500);
      }

      function continueStory() {
        if (continueButton.disabled) return;
        currentStep = (currentStep + 1) % steps.length;
        renderStep(currentStep);
      }

      continueButton.addEventListener("click", continueStory);
      document.addEventListener("keydown", (event) => {
        if (event.code !== "Space" && event.code !== "Enter") return;
        event.preventDefault();
        if (!continueButton.disabled) continueStory();
      });
      reducedMotion.addEventListener("change", () => renderStep(currentStep));
      renderStep(0);
    </script>
  </body>
</html>
